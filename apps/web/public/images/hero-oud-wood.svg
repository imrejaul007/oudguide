<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1815"/>
      <stop offset="60%" stop-color="#0e0c0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#805b10"/>
    </linearGradient>
    <linearGradient id="resinDark" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3a2312"/>
      <stop offset="40%" stop-color="#1f1107"/>
      <stop offset="80%" stop-color="#0c0703"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Golden Ambient Glow -->
  <circle cx="400" cy="300" r="220" fill="#c59b27" opacity="0.12" filter="url(#glow)"/>

  <!-- Polished Black Pedestal -->
  <ellipse cx="400" cy="460" rx="280" ry="60" fill="#14110e" stroke="#c59b27" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="400" cy="455" rx="240" ry="45" fill="#0d0b09" stroke="#dfba55" stroke-width="0.8" opacity="0.6"/>

  <!-- Wild Sinking Agarwood Specimen 1 (Main Central Piece) -->
  <path d="M 280 430 C 260 360, 290 280, 340 210 C 370 170, 390 130, 410 90 C 430 140, 460 200, 490 270 C 520 340, 540 400, 510 440 C 470 455, 330 450, 280 430 Z" fill="url(#resinDark)" stroke="#c59b27" stroke-width="1.2" opacity="0.95"/>

  <!-- Resinous Veins & Gilded Textures -->
  <path d="M 340 210 Q 370 260, 360 340 T 380 440" stroke="url(#goldSheen)" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 410 90 Q 420 180, 440 280 T 450 430" stroke="url(#goldSheen)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 310 320 Q 340 370, 320 420" stroke="url(#goldSheen)" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 470 230 Q 490 310, 480 390" stroke="url(#goldSheen)" stroke-width="1.5" fill="none" opacity="0.75"/>

  <!-- Secondary Companion Wood Chunks -->
  <path d="M 210 460 C 190 420, 220 380, 250 360 C 270 400, 260 440, 240 465 Z" fill="url(#resinDark)" stroke="#805b10" stroke-width="1"/>
  <path d="M 530 460 C 560 410, 580 370, 610 380 C 600 420, 570 455, 545 465 Z" fill="url(#resinDark)" stroke="#805b10" stroke-width="1"/>

  <!-- Blue Aromatic Smoke Ribbon -->
  <path d="M 405 100 Q 390 60, 420 30 T 400 -20" stroke="#7ec8e3" stroke-width="2" fill="none" opacity="0.45" filter="url(#glow)"/>
  <path d="M 410 100 Q 430 50, 410 15 T 430 -30" stroke="#a2d9ed" stroke-width="1.2" fill="none" opacity="0.3"/>

  <!-- Luxury Label Tag -->
  <rect x="290" y="520" width="220" height="34" rx="17" fill="#14110e" stroke="#c59b27" stroke-width="1"/>
  <text x="400" y="542" fill="#dfba55" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">WILD SINKING HEARTWOOD</text>
</svg>

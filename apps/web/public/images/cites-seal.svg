<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a5a48"/>
      <stop offset="70%" stop-color="#14362a"/>
      <stop offset="100%" stop-color="#0a1f18"/>
    </radialGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#7a5a0f"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="150" cy="150" r="140" fill="url(#sealBg)" stroke="url(#sealGold)" stroke-width="4"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="url(#sealGold)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Botanical Leaf Motif in Center -->
  <path d="M 150 70 C 130 110, 105 145, 150 205 C 195 145, 170 110, 150 70 Z" fill="none" stroke="url(#sealGold)" stroke-width="2.5"/>
  <path d="M 150 70 L 150 205" stroke="url(#sealGold)" stroke-width="1.5"/>
  <path d="M 150 110 Q 135 125, 125 140" stroke="url(#sealGold)" stroke-width="1.2" fill="none"/>
  <path d="M 150 110 Q 165 125, 175 140" stroke="url(#sealGold)" stroke-width="1.2" fill="none"/>
  <path d="M 150 145 Q 138 160, 130 175" stroke="url(#sealGold)" stroke-width="1.2" fill="none"/>
  <path d="M 150 145 Q 162 160, 170 175" stroke="url(#sealGold)" stroke-width="1.2" fill="none"/>

  <!-- Text Curved / Badges -->
  <text x="150" y="235" fill="#ffe8a3" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">CITES APPENDIX II</text>
  <text x="150" y="252" fill="#dfba55" font-family="sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle">LEGAL EXPORT COMPLIANCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="stillBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f1412"/>
      <stop offset="60%" stop-color="#110a08"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#e88e63"/>
      <stop offset="35%" stop-color="#bf5b2c"/>
      <stop offset="70%" stop-color="#803413"/>
      <stop offset="100%" stop-color="#401505"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd97d"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#6e500c"/>
    </linearGradient>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#stillBg)"/>
  <circle cx="360" cy="350" r="240" fill="#bf5b2c" opacity="0.12" filter="url(#flameGlow)"/>

  <!-- Hearth Base / Fire Pit -->
  <ellipse cx="360" cy="480" rx="190" ry="40" fill="#1f1008" stroke="#803413" stroke-width="1.5"/>

  <!-- Copper Deg (Cauldron Body) -->
  <path d="M 230 460 C 200 440, 190 350, 240 280 C 270 230, 310 210, 360 205 C 410 210, 450 230, 480 280 C 530 350, 520 440, 490 460 Z" fill="url(#copper)" stroke="#e88e63" stroke-width="1.8"/>

  <!-- Copper Alembic Dome Lid (Sarposh) -->
  <path d="M 270 220 C 290 170, 320 140, 360 135 C 400 140, 430 170, 450 220 Z" fill="url(#copper)" stroke="#ffd97d" stroke-width="1.5"/>

  <!-- Chonga (Bamboo / Copper Vapor Pipe to Receiver) -->
  <path d="M 360 135 Q 380 70, 460 70 T 560 160 L 560 300" fill="none" stroke="url(#brass)" stroke-width="9" stroke-linecap="round"/>

  <!-- Copper Bhapka (Receiver Vessel in Water Tank) -->
  <ellipse cx="560" cy="460" rx="90" ry="30" fill="#0f1915" stroke="#286653" stroke-width="1.5"/>
  <path d="M 500 450 C 485 410, 495 340, 530 320 C 545 310, 575 310, 590 320 C 625 340, 635 410, 620 450 Z" fill="url(#copper)" stroke="#ffd97d" stroke-width="1.5"/>

  <!-- Blue Scent Steam Ribbon -->
  <path d="M 560 300 Q 580 230, 550 170 T 590 90 T 560 20" fill="none" stroke="#7ec8e3" stroke-width="2.2" opacity="0.45" filter="url(#flameGlow)"/>

  <!-- Luxury Badge -->
  <rect x="290" y="535" width="220" height="34" rx="17" fill="#1a0d07" stroke="#bf5b2c" stroke-width="1"/>
  <text x="400" y="557" fill="#ffd97d" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">COPPER DEG DISTILLATION</text>
</svg>

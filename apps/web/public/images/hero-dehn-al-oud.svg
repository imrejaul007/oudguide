<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="oilBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#24170a"/>
      <stop offset="60%" stop-color="#120b05"/>
      <stop offset="100%" stop-color="#050301"/>
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe394"/>
      <stop offset="35%" stop-color="#d49b28"/>
      <stop offset="70%" stop-color="#94580b"/>
      <stop offset="100%" stop-color="#4d2703"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.5)"/>
    </linearGradient>
    <filter id="oilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#oilBg)"/>
  <circle cx="400" cy="310" r="230" fill="#d49b28" opacity="0.14" filter="url(#oilGlow)"/>

  <!-- Pedestal Base -->
  <ellipse cx="400" cy="480" rx="260" ry="50" fill="#140c06" stroke="#c59b27" stroke-width="1.2" opacity="0.6"/>

  <!-- Crystal Crystal Flacon Body -->
  <path d="M 330 460 C 310 460, 290 420, 290 310 C 290 220, 320 180, 360 170 L 360 140 L 440 140 L 440 170 C 480 180, 510 220, 510 310 C 510 420, 490 460, 470 460 Z" fill="#1a1107" stroke="#dfba55" stroke-width="2"/>

  <!-- Rich Amber Viscous Liquid Inside -->
  <path d="M 340 450 C 325 450, 305 415, 305 320 C 305 245, 335 220, 370 215 L 430 215 C 465 220, 495 245, 495 320 C 495 415, 475 450, 460 450 Z" fill="url(#amberGold)" opacity="0.92"/>

  <!-- Glass Facet Highlights & Reflections -->
  <path d="M 320 230 L 320 420" stroke="url(#glassSheen)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 480 230 L 480 420" stroke="url(#glassSheen)" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden Ornate Crystal Stopper -->
  <path d="M 370 140 L 370 100 C 370 80, 385 65, 400 65 C 415 65, 430 80, 430 100 L 430 140 Z" fill="#dfba55" stroke="#f5e1a4" stroke-width="1.5"/>
  <circle cx="400" cy="85" r="14" fill="#f5e1a4" opacity="0.6" filter="url(#oilGlow)"/>

  <!-- Suspended Viscous Droplet on Glass Wand -->
  <path d="M 400 480 C 390 480, 380 495, 390 515 C 395 525, 405 525, 410 515 C 420 495, 410 480, 400 480 Z" fill="url(#amberGold)" stroke="#f5e1a4" stroke-width="1.2" filter="url(#oilGlow)"/>

  <!-- Luxury Badge -->
  <rect x="290" y="540" width="220" height="34" rx="17" fill="#140c06" stroke="#c59b27" stroke-width="1"/>
  <text x="400" y="562" fill="#dfba55" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">PURE DEHN AL OUD OIL</text>
</svg>

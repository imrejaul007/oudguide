<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="crystalBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1620"/>
      <stop offset="60%" stop-color="#0c0a10"/>
      <stop offset="100%" stop-color="#050407"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c59b27" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5c161d" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#8c6a15"/>
    </linearGradient>
    <linearGradient id="perfume" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfba55" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a07d2d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c161d" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#crystalBg)"/>
  <circle cx="400" cy="300" r="260" fill="#c59b27" opacity="0.06"/>
  <!-- Three crystal flacons of varying sizes (private label line) -->
  <!-- Left flacon (small) -->
  <g transform="translate(220,350)">
    <path d="M -30 -50 L -30 -20 Q -45 -10 -45 30 L -45 90 Q -45 100 -35 100 L 35 100 Q 45 100 45 90 L 45 30 Q 45 -10 30 -20 L 30 -50 Z"
          fill="url(#crystalGrad)" stroke="#a07d2d" stroke-width="0.8"/>
    <!-- Liquid -->
    <path d="M -40 20 L -40 90 Q -40 95 -35 95 L 35 95 Q 40 95 40 90 L 40 20 Z"
          fill="url(#perfume)"/>
    <!-- Cap -->
    <rect x="-20" y="-80" width="40" height="30" fill="url(#goldFoil)" stroke="#5c161d" stroke-width="0.5"/>
    <rect x="-22" y="-82" width="44" height="4" fill="#f5e1a4"/>
    <!-- Highlights -->
    <line x1="-38" y1="0" x2="-38" y2="80" stroke="#f5e1a4" stroke-width="2" opacity="0.5"/>
    <line x1="-32" y1="10" x2="-32" y2="70" stroke="#f5e1a4" stroke-width="0.5" opacity="0.3"/>
    <!-- Label -->
    <rect x="-25" y="40" width="50" height="35" fill="#0d0a08" stroke="#c59b27" stroke-width="0.5" opacity="0.85"/>
    <line x1="-20" y1="50" x2="20" y2="50" stroke="#c59b27" stroke-width="0.4"/>
    <line x1="-15" y1="60" x2="15" y2="60" stroke="#c59b27" stroke-width="0.3"/>
    <line x1="-18" y1="68" x2="18" y2="68" stroke="#c59b27" stroke-width="0.3"/>
  </g>
  <!-- Center flacon (tall, hero piece) -->
  <g transform="translate(400,330)">
    <!-- Body: faceted crystal decanter -->
    <path d="M -55 -80 L -55 -30 Q -75 -15 -75 40 L -75 110 Q -75 125 -60 125 L 60 125 Q 75 125 75 110 L 75 40 Q 75 -15 55 -30 L 55 -80 Z"
          fill="url(#crystalGrad)" stroke="#c59b27" stroke-width="1"/>
    <!-- Facet lines -->
    <line x1="-50" y1="-30" x2="-50" y2="120" stroke="#f5e1a4" stroke-width="0.6" opacity="0.5"/>
    <line x1="-25" y1="-30" x2="-25" y2="120" stroke="#f5e1a4" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="-30" x2="0" y2="120" stroke="#f5e1a4" stroke-width="0.5" opacity="0.5"/>
    <line x1="25" y1="-30" x2="25" y2="120" stroke="#f5e1a4" stroke-width="0.5" opacity="0.4"/>
    <line x1="50" y1="-30" x2="50" y2="120" stroke="#f5e1a4" stroke-width="0.6" opacity="0.5"/>
    <!-- Liquid -->
    <path d="M -65 30 L -65 110 Q -65 120 -55 120 L 55 120 Q 65 120 65 110 L 65 30 Z"
          fill="url(#perfume)"/>
    <!-- Facet highlights on liquid -->
    <path d="M -65 30 L -45 30 L -45 110 Q -45 115 -50 118 L -65 110 Z" fill="#f5e1a4" opacity="0.15"/>
    <path d="M -25 30 L 0 30 L 0 115 L -25 115 Z" fill="#5c161d" opacity="0.2"/>
    <!-- Ornate gold cap -->
    <rect x="-32" y="-115" width="64" height="35" fill="url(#goldFoil)" stroke="#5c161d" stroke-width="0.6"/>
    <rect x="-35" y="-118" width="70" height="6" fill="#f5e1a4"/>
    <!-- Decorative ridges on cap -->
    <line x1="-30" y1="-110" x2="30" y2="-110" stroke="#5c161d" stroke-width="0.5"/>
    <line x1="-30" y1="-100" x2="30" y2="-100" stroke="#5c161d" stroke-width="0.5"/>
    <line x1="-30" y1="-90" x2="30" y2="-90" stroke="#5c161d" stroke-width="0.5"/>
    <!-- Top finial -->
    <ellipse cx="0" cy="-130" rx="22" ry="10" fill="url(#goldFoil)" stroke="#5c161d" stroke-width="0.5"/>
    <rect x="-3" y="-145" width="6" height="15" fill="url(#goldFoil)"/>
    <circle cx="0" cy="-150" r="6" fill="url(#goldFoil)" stroke="#5c161d" stroke-width="0.5"/>
    <!-- Front label (heraldic) -->
    <rect x="-40" y="40" width="80" height="50" fill="#0d0a08" stroke="#c59b27" stroke-width="0.6" opacity="0.9"/>
    <rect x="-37" y="43" width="74" height="44" fill="none" stroke="#c59b27" stroke-width="0.3"/>
    <!-- Heraldic crown on label -->
    <path d="M -12 50 L -10 56 L -16 56 L -8 60 L -16 64 L 0 64 L 16 64 L 8 60 L 16 56 L 10 56 L 12 50 Z" fill="#c59b27"/>
    <line x1="-30" y1="72" x2="30" y2="72" stroke="#c59b27" stroke-width="0.4"/>
    <line x1="-25" y1="78" x2="25" y2="78" stroke="#c59b27" stroke-width="0.3"/>
  </g>
  <!-- Right flacon (medium, gold trim) -->
  <g transform="translate(580,360)">
    <path d="M -40 -60 L -40 -25 Q -52 -10 -52 35 L -52 95 Q -52 105 -42 105 L 42 105 Q 52 105 52 95 L 52 35 Q 52 -10 40 -25 L 40 -60 Z"
          fill="url(#crystalGrad)" stroke="#c59b27" stroke-width="0.8"/>
    <path d="M -47 25 L -47 95 Q -47 100 -42 100 L 42 100 Q 47 100 47 95 L 47 25 Z"
          fill="url(#perfume)"/>
    <!-- Gold filigree on neck -->
    <path d="M -42 -25 Q 0 -32 42 -25" stroke="#c59b27" stroke-width="0.6" fill="none"/>
    <path d="M -42 -20 Q 0 -27 42 -20" stroke="#c59b27" stroke-width="0.4" fill="none" opacity="0.7"/>
    <!-- Cap -->
    <rect x="-25" y="-90" width="50" height="30" fill="url(#goldFoil)" stroke="#5c161d" stroke-width="0.5"/>
    <rect x="-27" y="-92" width="54" height="4" fill="#f5e1a4"/>
    <!-- Highlights -->
    <line x1="-44" y1="0" x2="-44" y2="80" stroke="#f5e1a4" stroke-width="2" opacity="0.5"/>
    <!-- Label -->
    <rect x="-30" y="45" width="60" height="38" fill="#0d0a08" stroke="#c59b27" stroke-width="0.5" opacity="0.85"/>
    <line x1="-22" y1="55" x2="22" y2="55" stroke="#c59b27" stroke-width="0.4"/>
    <line x1="-18" y1="65" x2="18" y2="65" stroke="#c59b27" stroke-width="0.3"/>
    <line x1="-20" y1="73" x2="20" y2="73" stroke="#c59b27" stroke-width="0.3"/>
  </g>
  <!-- Aromatic mist -->
  <g opacity="0.4">
    <ellipse cx="400" cy="180" rx="150" ry="40" fill="#dfba55"/>
    <ellipse cx="400" cy="140" rx="100" ry="25" fill="#f5e1a4"/>
    <ellipse cx="400" cy="100" rx="60" ry="15" fill="#f5e1a4" opacity="0.7"/>
  </g>
  <!-- Gold sparkles -->
  <g opacity="0.7" fill="#f5e1a4">
    <circle cx="320" cy="150" r="1.5"/>
    <circle cx="480" cy="180" r="1.2"/>
    <circle cx="280" cy="200" r="1"/>
    <circle cx="520" cy="220" r="1.5"/>
    <circle cx="350" cy="120" r="1"/>
    <circle cx="450" cy="130" r="1.3"/>
  </g>
  <!-- Ornamental frame -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#c59b27" stroke-width="0.4" opacity="0.4"/>
  <rect x="48" y="48" width="704" height="504" fill="none" stroke="#c59b27" stroke-width="0.3" opacity="0.25"/>
  <!-- Corner arabesque marks -->
  <g fill="#c59b27" opacity="0.6">
    <path d="M 60 60 L 80 60 L 80 62 L 62 62 L 62 80 L 60 80 Z"/>
    <path d="M 740 60 L 720 60 L 720 62 L 738 62 L 738 80 L 740 80 Z"/>
    <path d="M 60 540 L 80 540 L 80 538 L 62 538 L 62 520 L 60 520 Z"/>
    <path d="M 740 540 L 720 540 L 720 538 L 738 538 L 738 520 L 740 520 Z"/>
  </g>
</svg>